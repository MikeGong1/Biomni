# Trigger revision 4: run exactly once when the temporary draft PR is reopened.
name: Biomni remote research triage

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: biomni-remote-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/biomni-ecosystem-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and push one commit per batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          import base64
          import gzip
          payload = """"""
          with open("/tmp/generate_remote_research.py", "wb") as fh:
              fh.write(gzip.decompress(base64.b64decode(payload)))
          PY

          for batch in $(seq 9 46); do
            batch3=$(printf "%03d" "${batch}")
            python /tmp/generate_remote_research.py "${batch}"

            git add -f \
              "research/biomni-ecosystem/external-repos/remote-research-batch-${batch3}.md" \
              "research/biomni-ecosystem/external-repos/remote-research-batch-${batch3}-manifest.jsonl"

            if [ "${batch}" -eq 46 ]; then
              git add "research/biomni-ecosystem/external-repos/remote-research-summary.md"
              git rm ".github/workflows/biomni-remote-research.yml"
            fi

            if git diff --cached --quiet; then
              echo "No staged changes for Batch ${batch3}" >&2
              exit 1
            fi

            git commit -m "research: complete remote metadata triage batch ${batch3}"
            git push origin "HEAD:research/biomni-ecosystem-audit"
          done
