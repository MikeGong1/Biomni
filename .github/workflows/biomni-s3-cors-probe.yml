name: Biomni S3 CORS probe

on:
  push:
    paths:
      - '.github/workflows/biomni-s3-cors-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/biomni-s3-cors-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CORS and Range headers
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://biomni-release.s3.amazonaws.com/data_lake/go-plus.json'
          echo '=== OPTIONS preflight ==='
          curl -sS -D - -o /dev/null -X OPTIONS "$URL" \
            -H 'Origin: https://example.com' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: Range'
          echo '=== HEAD with Origin ==='
          curl -sS -I "$URL" -H 'Origin: https://example.com'
          echo '=== Range GET 0-0 with Origin ==='
          curl -sS -D - -o /dev/null "$URL" \
            -H 'Origin: https://example.com' \
            -H 'Range: bytes=0-0'
