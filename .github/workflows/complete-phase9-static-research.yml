name: Complete Phase 9A static research

on:
  push:
    branches:
      - research/biomni-ecosystem-audit
    paths:
      - .github/workflows/complete-phase9-static-research.yml
  pull_request:
    branches:
      - main
      - research/phase9-runner-base
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/complete-phase9-static-research.yml
      - research/biomni-ecosystem/workers/phase9-trigger/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biomni-phase9-static-completion
  cancel-in-progress: false

jobs:
  complete-phase9-static:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/biomni-ecosystem-audit
          fetch-depth: 1
          persist-credentials: true

      - name: Restore deterministic generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import zlib

          parts = pathlib.Path("research/biomni-ecosystem/workers/phase9_payload")
          payload = "".join(path.read_text(encoding="utf-8").strip() for path in sorted(parts.glob("part-*.txt")))
          target = pathlib.Path("research/biomni-ecosystem/workers/complete_phase9_static.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python3 -m py_compile research/biomni-ecosystem/workers/complete_phase9_static.py
          rm -rf research/biomni-ecosystem/workers/phase9_payload

      - name: Generate complete Phase 9A static research outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 research/biomni-ecosystem/workers/complete_phase9_static.py

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("research/biomni-ecosystem")
          expected = {
              root / "phase-9/candidate-family-static-normalization.jsonl": 598,
              root / "phase-9/sciagent-phase9-all-skills.jsonl": 203,
              root / "phase-9/commercial-oss-gap-static.jsonl": 17,
          }
          for path, count in expected.items():
              rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              assert len(rows) == count, (path, len(rows), count)
          features = [json.loads(line) for line in (root / "phase-9/provisional-features.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          implementations = [json.loads(line) for line in (root / "phase-9/provisional-implementations.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          queue = [json.loads(line) for line in (root / "phase-9/codex-phase9-validation-queue.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert features and implementations and queue
          assert len(features) == len(queue)
          assert len({row["provisional_feature_id"] for row in features}) == len(features)
          assert len({row["provisional_implementation_id"] for row in implementations}) == len(implementations)
          assert "COMPLETE_STATIC_RESEARCH" in (root / "phase-9/PHASE9_STATIC_COMPLETION_SUMMARY.md").read_text(encoding="utf-8")
          assert "PHASE 9A STATIC RESEARCH COMPLETE" in (root / "PHASE_9_STATE.md").read_text(encoding="utf-8")
          print(json.dumps({"features": len(features), "implementations": len(implementations), "validation_clusters": len(queue)}, sort_keys=True))
          PY

      - name: Commit and push Phase 9A completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/biomni-ecosystem
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "research: complete Phase 9A static normalization"
            git push origin HEAD:research/biomni-ecosystem-audit
          fi

# Trigger revision: 4
