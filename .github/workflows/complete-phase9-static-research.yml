name: Persist complete Phase 9A static research catalog

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
    paths:
      - .github/workflows/complete-phase9-static-research.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biomni-phase9-static-persistence
  cancel-in-progress: false

jobs:
  persist-phase9-static:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/biomni-ecosystem-audit
          fetch-depth: 1
          persist-credentials: true

      - name: Generate complete Phase 9A static research outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/biomni-ecosystem/workers/complete_phase9_static.py
          python3 research/biomni-ecosystem/workers/complete_phase9_static.py

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("research/biomni-ecosystem")
          expected = {
              root / "phase-9/candidate-family-static-normalization.jsonl": 598,
              root / "phase-9/sciagent-phase9-all-skills.jsonl": 203,
              root / "phase-9/commercial-oss-gap-static.jsonl": 17,
          }
          for path, count in expected.items():
              rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              assert len(rows) == count, (path, len(rows), count)

          features = [json.loads(line) for line in (root / "phase-9/provisional-features.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          implementations = [json.loads(line) for line in (root / "phase-9/provisional-implementations.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          queue = [json.loads(line) for line in (root / "phase-9/codex-phase9-validation-queue.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]

          assert len(features) == 91, len(features)
          assert len(implementations) == 801, len(implementations)
          assert len(queue) == 91, len(queue)
          assert len({row["provisional_feature_id"] for row in features}) == len(features)
          assert len({row["provisional_implementation_id"] for row in implementations}) == len(implementations)
          assert "COMPLETE_STATIC_RESEARCH" in (root / "phase-9/PHASE9_STATIC_COMPLETION_SUMMARY.md").read_text(encoding="utf-8")
          assert "PHASE 9A STATIC RESEARCH COMPLETE" in (root / "PHASE_9_STATE.md").read_text(encoding="utf-8")
          print(json.dumps({
              "candidate_families": 598,
              "sciagent_skills": 203,
              "features": len(features),
              "implementations": len(implementations),
              "validation_clusters": len(queue),
          }, sort_keys=True))
          PY

      - name: Commit and push machine-readable Phase 9A completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/biomni-ecosystem
          git add -f \
            research/biomni-ecosystem/phase-9/candidate-family-static-normalization.jsonl \
            research/biomni-ecosystem/phase-9/sciagent-phase9-all-skills.jsonl \
            research/biomni-ecosystem/phase-9/provisional-features.jsonl \
            research/biomni-ecosystem/phase-9/provisional-implementations.jsonl \
            research/biomni-ecosystem/phase-9/commercial-oss-gap-static.jsonl \
            research/biomni-ecosystem/phase-9/codex-phase9-validation-queue.jsonl
          git rm .github/workflows/complete-phase9-static-research.yml

          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "research: persist complete Phase 9A static catalog"
            git push origin HEAD:research/biomni-ecosystem-audit
          fi
