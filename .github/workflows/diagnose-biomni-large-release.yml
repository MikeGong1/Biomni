name: Diagnose Biomni large release run

on:
  push:
    paths:
      - '.github/workflows/diagnose-biomni-large-release.yml'

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report publish workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json
          jq -r '.workflow_runs[] | select(.name == "Publish Biomni large data files to draft Release") | [.id,.status,(.conclusion // ""),.head_sha,.event,.html_url] | @tsv' /tmp/runs.json | head -5 | tee /tmp/publish-runs.tsv
          {
            echo 'Biomni large Release publish-run diagnostic:'
            echo
            echo '```text'
            cat /tmp/publish-runs.tsv
            echo '```'
          } > /tmp/comment.md
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
