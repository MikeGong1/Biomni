name: Phase 9 rich classification diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/phase9-rich-classification-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/biomni-ecosystem-audit
          fetch-depth: 1
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json
          from collections import defaultdict
          from pathlib import Path

          root=Path('research/biomni-ecosystem')
          spec=importlib.util.spec_from_file_location('p9', root/'workers/complete_phase9_static.py')
          p9=importlib.util.module_from_spec(spec); spec.loader.exec_module(p9)
          repos=[json.loads(x) for x in (root/'database/repositories.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          grouped=defaultdict(list)
          for r in repos:
              try:q=int(r.get('external_deep_audit_queue_order'))
              except Exception:continue
              if r.get('external_deep_audit_result_class')=='DEEP_AUDIT_CANDIDATE': grouped[q].append(r)
          enrich=p9.load_enrichment()
          unmatched=[]; matched=[]
          for q,members in sorted(grouped.items()):
              e=enrich.get(q,{})
              fields=[]
              for r in members:
                  for k in ('full_name','description','relevance_reason','primary_language','topics','external_deep_audit_family_source','parent_full_name'):
                      fields.append(p9.flatten(r.get(k)))
              for k in ('family_source','substantive_change_groups','science','security','license','disposition','conflicts_or_missing','refs_pr_summary','metadata_classification','research_conclusion','recommended_local_action','risk_flags'):
                  fields.append(p9.flatten(e.get(k)))
              text=' '.join(fields)
              rules=p9.classify_text(text,max_rules=3)
              row={'queue_order':q,'family':members[0].get('external_deep_audit_family_key'),'repositories':[r.get('full_name') for r in members],'text':text[:1200],'rules':[x.key for x in rules]}
              (unmatched if rules[0].key=='research.reference.unclassified' else matched).append(row)
          out={'candidate_groups':len(grouped),'matched':len(matched),'unmatched':len(unmatched),'unmatched_rows':unmatched,'matched_sample':matched[:30]}
          (root/'phase-9/rich-classification-diagnostics.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/biomni-ecosystem/phase-9/rich-classification-diagnostics.json
          git rm .github/workflows/phase9-rich-classification-diagnostics.yml
          git commit -m 'research: diagnose rich Phase 9 classification'
          git push origin HEAD:research/biomni-ecosystem-audit
