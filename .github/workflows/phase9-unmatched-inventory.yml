name: Phase 9 unmatched rich inventory

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/phase9-unmatched-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/biomni-ecosystem-audit
          fetch-depth: 1
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, sys
          from collections import defaultdict
          from pathlib import Path

          root=Path('research/biomni-ecosystem')
          spec=importlib.util.spec_from_file_location('p9', root/'workers/complete_phase9_static.py')
          p9=importlib.util.module_from_spec(spec); sys.modules['p9']=p9; spec.loader.exec_module(p9)
          repos=[json.loads(x) for x in (root/'database/repositories.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          grouped=defaultdict(list)
          for r in repos:
              try:q=int(r.get('external_deep_audit_queue_order'))
              except Exception:continue
              if r.get('external_deep_audit_result_class')=='DEEP_AUDIT_CANDIDATE': grouped[q].append(r)
          enrich=p9.load_enrichment(); rows=[]
          for q,members in sorted(grouped.items()):
              e=enrich.get(q,{})
              fields=[]
              for r in members:
                  for k in ('full_name','description','relevance_reason','primary_language','topics','external_deep_audit_family_source','parent_full_name'):
                      fields.append(p9.flatten(r.get(k)))
              for k in ('family_source','substantive_change_groups','science','security','license','disposition','conflicts_or_missing','refs_pr_summary','metadata_classification','research_conclusion','recommended_local_action','risk_flags'):
                  fields.append(p9.flatten(e.get(k)))
              text=' '.join(x for x in fields if x).strip()
              rules=p9.classify_text(text,max_rules=3)
              if rules[0].key!='research.reference.unclassified': continue
              rows.append({
                  'queue_order':q,
                  'family_key':members[0].get('external_deep_audit_family_key'),
                  'repositories':[r.get('full_name') for r in members],
                  'descriptions':[r.get('description') for r in members if r.get('description')],
                  'relevance_reasons':[r.get('relevance_reason') for r in members if r.get('relevance_reason')],
                  'primary_languages':sorted({r.get('primary_language') for r in members if r.get('primary_language')}),
                  'substantive_change_groups':e.get('substantive_change_groups',[]),
                  'disposition':e.get('disposition'),
                  'security':e.get('security'),
                  'science':e.get('science'),
                  'text':text[:2500],
              })
          out=root/'phase-9/unmatched-rich-family-inventory.jsonl'
          out.write_text('\n'.join(json.dumps(x,ensure_ascii=False,sort_keys=True) for x in rows)+'\n',encoding='utf-8')
          assert len(rows)==224, len(rows)
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/biomni-ecosystem/phase-9/unmatched-rich-family-inventory.jsonl
          git rm .github/workflows/phase9-unmatched-inventory.yml
          git commit -m 'research: inventory unresolved Phase 9 families'
          git push origin HEAD:research/biomni-ecosystem-audit
