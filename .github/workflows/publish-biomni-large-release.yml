name: Publish Biomni large data files to draft Release

on:
  push:
    paths:
      - '.github/workflows/publish-biomni-large-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: biomni-large-release-400c1f366b96
  cancel-in-progress: false

env:
  TAG: biomni-data-lake-large-400c1f366b96-20260823
  TARGET_SHA: 400c1f366b96a35ca253e13c9b06c5076af41d65
  SOURCE_BASE: https://biomni-release.s3.amazonaws.com/data_lake

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release/tag already exists: $TAG"
          else
            cat > /tmp/release-notes.md <<'EOF'
          Biomni official Data Lake large-file transport release pinned to upstream repository commit `400c1f366b96a35ca253e13c9b06c5076af41d65`.

          This release is intentionally kept as a draft while third-party dataset redistribution terms are reviewed. Each data asset is downloaded from Biomni's official S3 source and accepted only if its exact byte size and SHA-256 match the files independently reconstructed and verified from the Drive chunk manifest.

          BindingDB_All_202409.tsv is not included in this release because it is larger than GitHub's per-release-asset size limit and was not fully reconstructible from the current local chunk set.
          EOF
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Biomni Data Lake large files (400c1f366b96)" \
              --notes-file /tmp/release-notes.md \
              --draft
          fi

  upload:
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - name: genebass_missense_LC_filtered.pkl
            size: 1662521913
            sha256: b0aec44d89d05a75acc7d7b00152ca5ca8b1edba2395d707551539b873c917d8
          - name: genebass_synonymous_filtered.pkl
            size: 1659139054
            sha256: 8482edb705eaae9715659027acbb0bcd3134499e0cfdb29bf07ab62e6ed923e5
          - name: genebass_pLoF_filtered.pkl
            size: 1524965298
            sha256: a0e8d0eb9931d42731591fd379d8566d83e4fb89b3dc2c705528293d5039ee64
          - name: kg.csv
            size: 981751236
            sha256: 0a5a010fcd88dcec572a573d98c26c1c244a11567092b6161d3ded611cfb5c69
          - name: DepMap_OmicsExpressionProteinCodingGenesTPMLogp1.csv
            size: 521526607
            sha256: e0326e16eb23bea1be980fce315acb36b224dedd7af6b47e0ba37e7747dbcc47
          - name: DepMap_CRISPRGeneEffect.csv
            size: 430424412
            sha256: 3f69c065a2991f19673fb49fdddf174acf35f2f5bdec9d798dfc884f737efcc4
          - name: DepMap_CRISPRGeneDependency.csv
            size: 422842760
            sha256: ee06cd822e73c57fe3e648493e00686d21b011f64d33776676831f7a9c58c6af
          - name: sgRNA_KO_SP_human.txt
            size: 379198983
            sha256: 047a99b2d6d5fc603b0c571c710674c700e88434b0ff6f8eeb9642b276485b10
          - name: sgRNA_KO_SP_mouse.txt
            size: 372277534
            sha256: 4a97c95d30948aed93cc76485d9698076e717fdce1b3fe3b71b5d78a49576eda
          - name: gwas_catalog.pkl
            size: 181492262
            sha256: d0ec229a3c98f7a4786ac7cfbb6ea19000878f782134968711a464b61d64b464
          - name: evebio_observed_points_table.csv
            size: 175336052
            sha256: a828c2dffe6846be2759d9a0456bc2fe39938ffc5118f053ad146847eaf0ab44
          - name: go-plus.json
            size: 129939533
            sha256: 2c3d7f6f42007858ba4055d52dca783b9a0fad9d368be04058a0e22e587ba5ac
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download, verify, and upload ${{ matrix.name }}
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_NAME: ${{ matrix.name }}
          EXPECTED_SIZE: ${{ matrix.size }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/$FILE_NAME"
          URL="$SOURCE_BASE/$FILE_NAME"

          echo "Downloading $URL"
          curl --fail --location \
            --retry 10 --retry-delay 5 --retry-all-errors \
            --output "$FILE" "$URL"

          ACTUAL_SIZE="$(stat -c '%s' "$FILE")"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $FILE" | sha256sum -c -

          echo "Uploading verified asset: $FILE_NAME ($ACTUAL_SIZE bytes)"
          gh release upload "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          rm -f "$FILE"

  verify:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify all 12 release assets and publish checksums
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/expected.tsv <<'EOF'
          genebass_missense_LC_filtered.pkl	1662521913	b0aec44d89d05a75acc7d7b00152ca5ca8b1edba2395d707551539b873c917d8
          genebass_synonymous_filtered.pkl	1659139054	8482edb705eaae9715659027acbb0bcd3134499e0cfdb29bf07ab62e6ed923e5
          genebass_pLoF_filtered.pkl	1524965298	a0e8d0eb9931d42731591fd379d8566d83e4fb89b3dc2c705528293d5039ee64
          kg.csv	981751236	0a5a010fcd88dcec572a573d98c26c1c244a11567092b6161d3ded611cfb5c69
          DepMap_OmicsExpressionProteinCodingGenesTPMLogp1.csv	521526607	e0326e16eb23bea1be980fce315acb36b224dedd7af6b47e0ba37e7747dbcc47
          DepMap_CRISPRGeneEffect.csv	430424412	3f69c065a2991f19673fb49fdddf174acf35f2f5bdec9d798dfc884f737efcc4
          DepMap_CRISPRGeneDependency.csv	422842760	ee06cd822e73c57fe3e648493e00686d21b011f64d33776676831f7a9c58c6af
          sgRNA_KO_SP_human.txt	379198983	047a99b2d6d5fc603b0c571c710674c700e88434b0ff6f8eeb9642b276485b10
          sgRNA_KO_SP_mouse.txt	372277534	4a97c95d30948aed93cc76485d9698076e717fdce1b3fe3b71b5d78a49576eda
          gwas_catalog.pkl	181492262	d0ec229a3c98f7a4786ac7cfbb6ea19000878f782134968711a464b61d64b464
          evebio_observed_points_table.csv	175336052	a828c2dffe6846be2759d9a0456bc2fe39938ffc5118f053ad146847eaf0ab44
          go-plus.json	129939533	2c3d7f6f42007858ba4055d52dca783b9a0fad9d368be04058a0e22e587ba5ac
          EOF

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "true"

          while IFS=$'\t' read -r NAME SIZE SHA; do
            ACTUAL_SIZE="$(jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .size' <<<"$RELEASE_JSON")"
            STATE="$(jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .state' <<<"$RELEASE_JSON")"
            test "$ACTUAL_SIZE" = "$SIZE"
            test "$STATE" = "uploaded"
          done < /tmp/expected.tsv

          cut -f3,1 /tmp/expected.tsv | awk '{print $1 "  " $2}' > /tmp/BIOMNI_LARGE_12_SHA256SUMS
          cp /tmp/expected.tsv /tmp/BIOMNI_LARGE_12_ASSET_SIZES_AND_SHA256.tsv
          gh release upload "$TAG" \
            /tmp/BIOMNI_LARGE_12_SHA256SUMS \
            /tmp/BIOMNI_LARGE_12_ASSET_SIZES_AND_SHA256.tsv \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          TOTAL_BYTES="$(awk -F '\t' '{s += $2} END {printf "%.0f", s}' /tmp/expected.tsv)"
          cat > /tmp/pr-comment.md <<EOF
          Draft GitHub Release large-data upload verified: **12/12 assets**.

          - Tag: \`$TAG\`
          - Total data bytes: \`$TOTAL_BYTES\`
          - Release remains **draft** pending third-party redistribution-license review.
          - Every asset matched the independently reconstructed workspace SHA-256 and exact byte size before upload.
          - Two machine-readable checksum/size manifests were also attached.
          EOF
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md

          echo "=== VERIFIED RELEASE ASSETS ==="
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | [.name, .size, .state] | @tsv'
