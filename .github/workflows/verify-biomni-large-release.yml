name: Verify Biomni large draft Release

on:
  push:
    paths:
      - '.github/workflows/verify-biomni-large-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: biomni-data-lake-large-400c1f366b96-20260823
    steps:
      - name: Verify existing assets and attach manifests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.tsv <<'EOF'
          genebass_missense_LC_filtered.pkl	1662521913	b0aec44d89d05a75acc7d7b00152ca5ca8b1edba2395d707551539b873c917d8
          genebass_synonymous_filtered.pkl	1659139054	8482edb705eaae9715659027acbb0bcd3134499e0cfdb29bf07ab62e6ed923e5
          genebass_pLoF_filtered.pkl	1524965298	a0e8d0eb9931d42731591fd379d8566d83e4fb89b3dc2c705528293d5039ee64
          kg.csv	981751236	0a5a010fcd88dcec572a573d98c26c1c244a11567092b6161d3ded611cfb5c69
          DepMap_OmicsExpressionProteinCodingGenesTPMLogp1.csv	521526607	e0326e16eb23bea1be980fce315acb36b224dedd7af6b47e0ba37e7747dbcc47
          DepMap_CRISPRGeneEffect.csv	430424412	3f69c065a2991f19673fb49fdddf174acf35f2f5bdec9d798dfc884f737efcc4
          DepMap_CRISPRGeneDependency.csv	422842760	ee06cd822e73c57fe3e648493e00686d21b011f64d33776676831f7a9c58c6af
          sgRNA_KO_SP_human.txt	379198983	047a99b2d6d5fc603b0c571c710674c700e88434b0ff6f8eeb9642b276485b10
          sgRNA_KO_SP_mouse.txt	372277534	4a97c95d30948aed93cc76485d9698076e717fdce1b3fe3b71b5d78a49576eda
          gwas_catalog.pkl	181492262	d0ec229a3c98f7a4786ac7cfbb6ea19000878f782134968711a464b61d64b464
          evebio_observed_points_table.csv	175336052	a828c2dffe6846be2759d9a0456bc2fe39938ffc5118f053ad146847eaf0ab44
          go-plus.json	129939533	2c3d7f6f42007858ba4055d52dca783b9a0fad9d368be04058a0e22e587ba5ac
          EOF

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets,url > /tmp/release.json
          test "$(jq -r '.isDraft' /tmp/release.json)" = "true"
          test "$(jq -r '.tagName' /tmp/release.json)" = "$TAG"

          while IFS=$'\t' read -r NAME SIZE SHA; do
            COUNT="$(jq --arg n "$NAME" '[.assets[] | select(.name == $n)] | length' /tmp/release.json)"
            test "$COUNT" = "1"
            ACTUAL_SIZE="$(jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .size' /tmp/release.json)"
            STATE="$(jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .state' /tmp/release.json)"
            test "$ACTUAL_SIZE" = "$SIZE"
            test "$STATE" = "uploaded"
            printf 'OK\t%s\t%s\t%s\n' "$NAME" "$SIZE" "$SHA"
          done < /tmp/expected.tsv

          awk -F '\t' '{print $3 "  " $1}' /tmp/expected.tsv > /tmp/BIOMNI_LARGE_12_SHA256SUMS
          cp /tmp/expected.tsv /tmp/BIOMNI_LARGE_12_ASSET_SIZES_AND_SHA256.tsv
          gh release upload "$TAG" \
            /tmp/BIOMNI_LARGE_12_SHA256SUMS \
            /tmp/BIOMNI_LARGE_12_ASSET_SIZES_AND_SHA256.tsv \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          TOTAL_BYTES="$(awk -F '\t' '{s += $2} END {printf "%.0f", s}' /tmp/expected.tsv)"
          RELEASE_URL="$(jq -r '.url' /tmp/release.json)"
          cat > /tmp/comment.md <<EOF
          Draft GitHub Release large-data upload verified: **12/12 assets**.

          - Tag: \`$TAG\`
          - Total data bytes: \`$TOTAL_BYTES\`
          - Release URL: $RELEASE_URL
          - Release remains **draft** pending third-party redistribution-license review.
          - Each asset was SHA-256 and byte-size checked against the independently reconstructed workspace files before upload.
          - \`BIOMNI_LARGE_12_SHA256SUMS\` and \`BIOMNI_LARGE_12_ASSET_SIZES_AND_SHA256.tsv\` are attached.
          EOF
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

          echo '=== FINAL ASSET LIST ==='
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .size, .state] | @tsv'
